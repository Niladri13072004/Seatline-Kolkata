  <path d="M0 718c172-62 291 78 467 3s301-59 452 11 295 60 445-9 333 0 556 29" fill="none" stroke="#83a8ad" stroke-opacity=".38" stroke-width="7"/>
  <path d="M0 806c182-53 302 55 470-3s306-67 464 4 295 56 453-6 334-4 533 31" fill="none" stroke="#b7d3cf" stroke-opacity=".18" stroke-width="4"/>
  <g filter="url(#glow)" opacity=".32">
    <ellipse cx="960" cy="681" rx="288" ry="56" fill="#e7bd6d"/>
  </g>
  <g transform="translate(960 595)">
